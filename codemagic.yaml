workflows:
  ios-release:
    name: Apexly iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: apexly_asc # integración creada en Codemagic > Team settings > Integrations
    environment:
      groups:
        - sentry # SENTRY_AUTH_TOKEN, para subir mapas de fuente en el prebuild
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yeissyapps.circuitodiario
      vars:
        BUNDLE_ID: "com.yeissyapps.circuitodiario"
        # El paso "Bundle React Native code and images" queda envuelto por
        # sentry-cli (ver sentry-xcode.sh en @sentry/react-native), que
        # intenta crear un release en Sentry vía API antes de bundlear. Si
        # SENTRY_AUTH_TOKEN (grupo "sentry" de arriba) falta o no vale, esa
        # llamada falla con "API request failed" y TUMBA el build entero —
        # aunque el fallo no tenga nada que ver con el bundle en sí. Con esto
        # en true, el paso se salta y bundlea directo: sin subir sourcemaps
        # (los crashes de esta build llegarán sin desminificar), pero el
        # build ya no depende de que el token de Sentry esté bien.
        # Quitar en cuanto se confirme que el token del grupo "sentry" vuelve
        # a funcionar.
        SENTRY_DISABLE_AUTO_UPLOAD: "true"
      node: 20.18.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependencias
        script: |
          npm ci

      - name: Expo prebuild (genera proyecto nativo ios/)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Numero de build automatico (Apple no admite duplicados)
        script: |
          #!/bin/sh
          set -e
          # Nos ha pasado varias veces: subir a mano el buildNumber en
          # app.json y olvidarlo, o subirlo pero reusar el numero porque ya
          # habia una build anterior con ese mismo valor colgada en App
          # Store Connect (publish rechazado con 409, "must be higher than
          # the previously uploaded version"). Con esto deja de depender de
          # acordarse: se pregunta a Apple cual es el numero mas alto que YA
          # conoce (TestFlight o App Store, lo que sea mayor) y se usa ese +1,
          # ignorando lo que ponga app.json salvo que sea aun mas alto (así
          # nunca se compila un numero que ya existe, sea cual sea el origen
          # del despiste).
          #
          # agvtool pisa el proyecto nativo YA generado por prebuild, no
          # app.json: no hace falta comitear nada de vuelta al repo, cada
          # build de Codemagic calcula el suyo.
          APP_STORE_APPLE_ID=$(app-store-connect apps list --bundle-id "$BUNDLE_ID" --json | jq '.[0].id' -r)
          TESTFLIGHT_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          APPSTORE_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          LOCAL_BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          HIGHEST=$TESTFLIGHT_BUILD
          [ "$APPSTORE_BUILD" -gt "$HIGHEST" ] && HIGHEST=$APPSTORE_BUILD
          [ "$LOCAL_BUILD" -gt "$HIGHEST" ] && HIGHEST=$LOCAL_BUILD
          NEW_BUILD=$((HIGHEST + 1))
          echo "TestFlight=$TESTFLIGHT_BUILD AppStore=$APPSTORE_BUILD app.json=$LOCAL_BUILD -> usando $NEW_BUILD"
          cd ios && agvtool new-version -all "$NEW_BUILD"

      - name: Instalar pods
        script: |
          cd ios && pod install

      - name: Aplicar firma al proyecto Xcode
        script: |
          xcode-project use-profiles

      - name: Detectar workspace y scheme generados por Expo
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(find ios -name "*.xcscheme" | head -1 | xargs -n1 basename | sed 's/\.xcscheme$//')
          echo "Workspace detectado: $WORKSPACE"
          echo "Scheme detectado: $SCHEME"
          echo "XCODE_WORKSPACE=$WORKSPACE" >> $CM_ENV
          echo "XCODE_SCHEME=$SCHEME" >> $CM_ENV

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: AFTER_APPROVAL # se publica solo en cuanto Apple apruebe, sin paso manual
